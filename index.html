<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio milik DeniARP.26 a.k.a EzCraftID — just a random person.">
    <title>DeniARP.26 - Portfolio</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Container Utama -->
    <div class="card">
        <!-- Ganti src dengan link atau file fotomu -->
        <img src="assets/img/avatar.png" alt="Profile Picture" class="avatar" id="avatar">

        <div class="content">
            <!-- Nama utama + alias kecil di sebelahnya -->
            <div class="name-row">
                <h1 class="name">DeniARP.26</h1>
                <span class="alias">a.k.a EzCraftID</span>
            </div>

            <p class="subtitle">Just a random person.</p>

            <div class="social-links">
                <a href="#" class="social-btn" id="btn-github"  aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="#" class="social-btn" id="btn-discord" aria-label="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
                <a href="#" class="social-btn" id="btn-email"   aria-label="Email">
                    <i class="fa-solid fa-envelope"></i>
                </a>
                <a href="#" class="social-btn" id="btn-more"    aria-label="More">
                    <i class="fa-solid fa-ellipsis"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Scroll hint di dasar layar dengan panah animasi -->
    <div class="scroll-hint" id="scroll-hint">
        <span>Scroll to projects!</span>
        <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </div>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>

</body>
</html>
